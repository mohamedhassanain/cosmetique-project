# This is a Postman Collection (v2.1.0 format in YAML v3).
# Import in Postman: File > Import (or drag & drop).
type: collection
info:
  _postman_id: f7d2b81a-kissariya-api
  name: Kissariya Cosmétiques - Supabase API
  description: |-
    Collection de tests pour l'API Supabase (PostgREST + GoTrue + Storage) utilisée par l'application Kissariya. Importez l'environnement 'Kissariya - Supabase' d'abord, puis renseignez supabase_url, anon_key, service_role_key, admin_email et admin_password.

    Fonctionnement : l'app React n'a pas de backend - elle appelle Supabase directement. Ces requêtes reproduisent exactement les appels des services src/services/*.ts.

    Ordre recommandé :
    1. Auth → Login (récupère automatiquement le token admin)
    2. Public → exploration des données
    3. Admin → CRUD produit/catégorie/commande/promo
    4. Storage → upload d'image
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
item:
  - name: 🔐 Auth (GoTrue)
    description: Endpoints d'authentification Supabase Auth (auth/v1). Le login remplit automatiquement access_token, refresh_token et user_id utilisés par toutes les requêtes admin.
    item:
      - name: Sign Up (créer compte)
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "email": "{{admin_email}}",
                "password": "{{admin_password}}"
              }
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/auth/v1/signup'
            host:
              - '{{supabase_url}}'
            path:
              - auth
              - v1
              - signup
          description: Crée un utilisateur. Réponse 200 = compte existant (le signup renvoie alors le message 'User already registered'). 200 = succès.
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - const json = pm.response.json();
                - if (json.id) {
                - '  pm.environment.set(''user_id'', json.id);'
                - '  pm.environment.set(''access_token'', json.access_token);'
                - '  pm.environment.set(''refresh_token'', json.refresh_token);'
                - '}'
      - name: Login (mot de passe)
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "email": "{{admin_email}}",
                "password": "{{admin_password}}"
              }
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/auth/v1/token?grant_type=password'
            host:
              - '{{supabase_url}}'
            path:
              - auth
              - v1
              - token
            query:
              - key: grant_type
                value: password
          description: 'Login admin. IMPORTANT : après le login, vérifiez que le compte a le rôle ''admin'' dans la table public.profiles (SQL Editor Supabase), sinon les requêtes Admin renverront 403/empty.'
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - const json = pm.response.json();
                - pm.environment.set('access_token', json.access_token);
                - pm.environment.set('refresh_token', json.refresh_token);
                - pm.environment.set('user_id', json.user?.id);
                - pm.test('Token capturé', () => pm.expect(json.access_token).to.not.be.empty);
      - name: Refresh Token
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "refresh_token": "{{refresh_token}}"
              }
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/auth/v1/token?grant_type=refresh_token'
            host:
              - '{{supabase_url}}'
            path:
              - auth
              - v1
              - token
            query:
              - key: grant_type
                value: refresh_token
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - const json = pm.response.json();
                - pm.environment.set('access_token', json.access_token);
                - pm.environment.set('refresh_token', json.refresh_token);
      - name: Get User (me)
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Authorization
              value: Bearer {{access_token}}
          url:
            raw: '{{supabase_url}}/auth/v1/user'
            host:
              - '{{supabase_url}}'
            path:
              - auth
              - v1
              - user
          description: Retourne l'utilisateur connecté. Test rapide pour vérifier que le token est valide.
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - pm.test('Un utilisateur est retourné', () => pm.expect(pm.response.json().id).to.exist);
      - name: Logout
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Authorization
              value: Bearer {{access_token}}
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: '{}'
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/auth/v1/logout'
            host:
              - '{{supabase_url}}'
            path:
              - auth
              - v1
              - logout
  - name: 🌍 Public (lectures + créations visiteur)
    description: Requêtes accessibles SANS authentification (header apikey anon uniquement). Elles correspondent aux endpoints appelés par la boutique.
    item:
      - name: Produits actifs (accueil)
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/products?select=id,name,slug,price,original_price,is_promotion,is_featured,image_url,brand,created_at,category_id,subcategory_id,categories(name,slug),subcategories(name)&is_active=eq.true&order=created_at.desc&limit=60'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - products
            query:
              - key: select
                value: id,name,slug,price,original_price,is_promotion,is_featured,image_url,brand,created_at,category_id,subcategory_id,categories(name,slug),subcategories(name)
              - key: is_active
                value: eq.true
              - key: order
                value: created_at.desc
              - key: limit
                value: '60'
          description: Équivalent de fetchActiveProducts() — 60 derniers produits actifs.
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - pm.test('Réponse = tableau', () => pm.expect(pm.response.json()).to.be.an('array'));
                - if (pm.response.json().length > 0) {
                - '  pm.environment.set(''product_id'', pm.response.json()[0].id);'
                - '  pm.environment.set(''slug'', pm.response.json()[0].slug);'
                - '}'
      - name: Produits filtrés + pagination
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/products?select=id,name,slug,price,original_price,is_promotion,is_featured,image_url,brand,created_at,categories(name,slug),subcategories(name)&is_active=eq.true&order=created_at.desc&limit=16&offset=0'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - products
            query:
              - key: select
                value: id,name,slug,price,original_price,is_promotion,is_featured,image_url,brand,created_at,categories(name,slug),subcategories(name)
              - key: is_active
                value: eq.true
              - key: order
                value: created_at.desc
              - key: limit
                value: '16'
              - key: offset
                value: '0'
          description: Page 1 (offset 0, limit 16). Modifiez category_id=eq.<uuid> pour filtrer par catégorie.
      - name: Recherche plein-texte + ilike
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/products?select=id,name,slug,price,brand&is_active=eq.true&or=(search_vector.phfts.{{search}},name.ilike.*{{search}}*,brand.ilike.*{{search}}*)&limit=16'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - products
            query:
              - key: select
                value: id,name,slug,price,brand
              - key: is_active
                value: eq.true
              - key: or
                value: (search_vector.phfts.{{search}},name.ilike.*{{search}}*,brand.ilike.*{{search}}*)
              - key: limit
                value: '16'
          description: 'Équivalent de fetchPublicProducts() avec search. Changez la variable ''search'' dans l''environnement (ex: creme, serum, maroc...).'
      - name: Produit par slug
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/products?select=id,name,slug,description,ingredients,how_to_use,price,original_price,is_promotion,is_active,image_url,video_url,category_id,subcategory_id,stock_quantity,weight_grams,brand,location_city,location_url,show_location,created_at,categories(name,slug),subcategories(name),product_images(id,url,sort_order)&slug=eq.{{slug}}&is_active=eq.true'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - products
            query:
              - key: select
                value: id,name,slug,description,ingredients,how_to_use,price,original_price,is_promotion,is_active,image_url,video_url,category_id,subcategory_id,stock_quantity,weight_grams,brand,location_city,location_url,show_location,created_at,categories(name,slug),subcategories(name),product_images(id,url,sort_order)
              - key: slug
                value: eq.{{slug}}
              - key: is_active
                value: eq.true
          description: Équivalent de fetchProductBySlug(). Modifiez la variable 'slug' dans l'environnement.
      - name: Catégories
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/categories?select=*&order=sort_order.asc'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - categories
            query:
              - key: select
                value: '*'
              - key: order
                value: sort_order.asc
          description: Équivalent de fetchCategories().
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 200', () => pm.response.to.have.status(200));
                - const json = pm.response.json();
                - if (json.length > 0) pm.environment.set('category_id', json[0].id);
      - name: Sous-catégories d'une catégorie
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/subcategories?select=*&category_id=eq.{{category_id}}&order=sort_order.asc'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - subcategories
            query:
              - key: select
                value: '*'
              - key: category_id
                value: eq.{{category_id}}
              - key: order
                value: sort_order.asc
          description: Équivalent de fetchSubcategories(category_id). Capture l'id dans subcategory_id.
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - const json = pm.response.json();
                - if (json.length > 0) pm.environment.set('subcategory_id', json[0].id);
      - name: Promos actives (hero)
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/promos?select=*&is_active=eq.true&order=sort_order.asc'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - promos
            query:
              - key: select
                value: '*'
              - key: is_active
                value: eq.true
              - key: order
                value: sort_order.asc
          description: Équivalent de fetchActivePromos().
      - name: Site settings (public)
        request:
          method: GET
          header:
            - key: apikey
              value: '{{anon_key}}'
          url:
            raw: '{{supabase_url}}/rest/v1/site_settings?select=*&limit=1'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - site_settings
            query:
              - key: select
                value: '*'
              - key: limit
                value: '1'
          description: Équivalent de fetchSiteSettings() et fetchWhatsAppNumber().
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - const json = pm.response.json();
                - if (Array.isArray(json) && json[0]?.id) pm.environment.set('settings_id', json[0].id);
                - else if (json?.id) pm.environment.set('settings_id', json.id);
      - name: Créer une commande (visiteur WhatsApp)
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Content-Type
              value: application/json
            - key: Prefer
              value: return=representation
          body:
            mode: raw
            raw: |-
              {
                "customer_name": "Test Postman",
                "customer_phone": "+212600000000",
                "customer_city": "Casablanca",
                "product_name": "Crème Hydratante Visage",
                "product_id": "{{product_id}}",
                "quantity": 2,
                "total_price": 298,
                "status": "pending",
                "notes": "Commande créée depuis Postman"
              }
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/rest/v1/orders'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - orders
          description: Équivalent de createOrder(). INSERT est ouvert au public par la policy RLS orders_insert_public — c'est voulu (commandes WhatsApp sans compte).
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Status 201', () => pm.response.to.have.status(201));
                - const json = pm.response.json();
                - if (Array.isArray(json) && json[0]?.id) {
                - '  pm.environment.set(''order_id'', json[0].id);'
                - '  console.log(''Commande créée : '' + json[0].id);'
                - '}'
      - name: Envoyer un message de contact
        request:
          method: POST
          header:
            - key: apikey
              value: '{{anon_key}}'
            - key: Content-Type
              value: application/json
            - key: Prefer
              value: return=representation
          body:
            mode: raw
            raw: |-
              {
                "name": "Test Postman",
                "email": "test@example.com",
                "phone": "+212600000000",
                "subject": "Question produit",
                "message": "Bonjour, ce produit est-il disponible à Casablanca ?"
              }
            options:
              raw:
                language: json
          url:
            raw: '{{supabase_url}}/rest/v1/contact_messages'
            host:
              - '{{supabase_url}}'
            path:
              - rest
              - v1
              - contact_messages
          description: INSERT public (policy contact_messages_insert_public).
  - name: 🔐 Admin (CRUD protégé)
    description: 'Toutes ces requêtes exigent Authorization: Bearer {{access_token}} ET que le compte ait le rôle ''admin'' dans public.profiles (fonction public.is_admin()). Sinon → 403 ou tableau vide. Assurez-vous d''avoir lancé ''Login'' d''abord.'
    item:
      - name: PRODUITS
        item:
          - name: Liste tous les produits (admin)
            request:
              method: GET
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
                - key: Prefer
                  value: count=exact
              url:
                raw: '{{supabase_url}}/rest/v1/products?select=id,name,slug,description,price,original_price,is_promotion,is_featured,is_active,image_url,video_url,category_id,subcategory_id,stock_quantity,weight_grams,brand,location_city,location_url,show_location,created_at,updated_at,categories(name,slug),subcategories(name),product_images(id,url,sort_order)&order=created_at.desc&limit=20&offset=0'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - products
                query:
                  - key: select
                    value: id,name,slug,description,price,original_price,is_promotion,is_featured,is_active,image_url,video_url,category_id,subcategory_id,stock_quantity,weight_grams,brand,location_city,location_url,show_location,created_at,updated_at,categories(name,slug),subcategories(name),product_images(id,url,sort_order)
                  - key: order
                    value: created_at.desc
                  - key: limit
                    value: '20'
                  - key: offset
                    value: '0'
              description: 'Équivalent de fetchAllProducts(). Le header Prefer: count=exact renvoie le total dans X-Total-Count.'
            event:
              - listen: test
                script:
                  type: text/javascript
                  exec:
                    - pm.test('Status 200', () => pm.response.to.have.status(200));
                    - const json = pm.response.json();
                    - pm.test('X-Total-Count présent', () => pm.expect(pm.response.headers.get('X-Total-Count')).to.exist);
                    - if (json.length > 0) pm.environment.set('product_id', json[0].id);
          - name: Créer un produit
            request:
              method: POST
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
                - key: Content-Type
                  value: application/json
                - key: Prefer
                  value: return=representation
              body:
                mode: raw
                raw: |-
                  {
                    "name": "Crème Hydratante Visage 50ml",
                    "slug": "creme-hydratante-visage-50ml",
                    "description": "Crème hydratante légère pour peau sèche et sensible.",
                    "ingredients": "Eau, Aloe Vera, Beurre de karité",
                    "how_to_use": "Appliquer matin et soir sur peau propre.",
                    "price": 149,
                    "original_price": 199,
                    "is_promotion": true,
                    "is_featured": true,
                    "is_active": true,
                    "category_id": "{{category_id}}",
                    "stock_quantity": 25,
                    "weight_grams": 50,
                    "brand": "Kissariya",
                    "location_city": "Casablanca",
                    "location_url": "https://maps.google.com/?q=Casablanca",
                    "show_location": true
                  }
                options:
                  raw:
                    language: json
              url:
                raw: '{{supabase_url}}/rest/v1/products'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - products
              description: Équivalent de createProduct(). Le slug doit être unique. Capte l'id dans product_id.
            event:
              - listen: test
                script:
                  type: text/javascript
                  exec:
                    - pm.test('Status 201', () => pm.response.to.have.status(201));
                    - const json = pm.response.json();
                    - 'const p = Array.isArray(json) ? json[0] : json;'
                    - if (p?.id) {
                    - '  pm.environment.set(''product_id'', p.id);'
                    - '  console.log(''Produit créé : '' + p.id);'
                    - '}'
          - name: Modifier un produit
            request:
              method: PATCH
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
                - key: Content-Type
                  value: application/json
                - key: Prefer
                  value: return=representation
              body:
                mode: raw
                raw: |-
                  {
                    "price": 129,
                    "is_promotion": true,
                    "stock_quantity": 30
                  }
                options:
                  raw:
                    language: json
              url:
                raw: '{{supabase_url}}/rest/v1/products?id=eq.{{product_id}}'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - products
                query:
                  - key: id
                    value: eq.{{product_id}}
              description: Équivalent de updateProduct(). Ne modifier QUE les champs voulus.
            event:
              - listen: test
                script:
                  type: text/javascript
                  exec:
                    - pm.test('Status 200', () => pm.response.to.have.status(200));
                    - const json = pm.response.json();
                    - 'const p = Array.isArray(json) ? json[0] : json;'
                    - pm.test('Produit mis à jour', () => pm.expect(p.id).to.eql(pm.environment.get('product_id')));
          - name: Ajouter une image secondaire
            request:
              method: POST
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
                - key: Content-Type
                  value: application/json
                - key: Prefer
                  value: return=representation
              body:
                mode: raw
                raw: |-
                  {
                    "product_id": "{{product_id}}",
                    "url": "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=800",
                    "sort_order": 0
                  }
                options:
                  raw:
                    language: json
              url:
                raw: '{{supabase_url}}/rest/v1/product_images'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - product_images
              description: Correspond aux lignes gérées par replaceProductImages() dans le code.
          - name: Supprimer un produit
            request:
              method: DELETE
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
              url:
                raw: '{{supabase_url}}/rest/v1/products?id=eq.{{product_id}}'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - products
                query:
                  - key: id
                    value: eq.{{product_id}}
              description: Supprime le produit (les product_images partent en cascade). ⚠️ Irréversible.
            event:
              - listen: test
                script:
                  type: text/javascript
                  exec:
                    - pm.test('Status 204', () => pm.response.to.have.status(204));
      - name: CATÉGORIES & SOUS-CATÉGORIES
        item:
          - name: Créer une catégorie
            request:
              method: POST
              header:
                - key: apikey
                  value: '{{anon_key}}'
                - key: Authorization
                  value: Bearer {{access_token}}
                - key: Content-Type
                  value: application/json
                - key: Prefer
                  value: return=representation
              body:
                mode: raw
                raw: |-
                  {
                    "name": "Soins Solaires",
                    "slug": "soins-solaires",
                    "description": "Protection solaire visage et corps",
                    "sort_order": 9
                  }
                options:
                  raw:
                    language: json
              url:
                raw: '{{supabase_url}}/rest/v1/categories'
                host:
                  - '{{supabase_url}}'
                path:
                  - rest
                  - v1
                  - categories
              description: Équivalent de createCategory().
            event:
              - listen: test
                script:
                  type: text/javascript
                  exec:
                    - pm.test('Status 201', () => pm.response.to.have.status(201));
                    - const json = pm.response.json();
                    - 'const c = Array.isArray(json) ? json[0] : json;'
                    - if (c?.id) {
                    - '  pm.environment.set(''category_id'', c.id);'
                    - '  console.log(''Catégorie créée : '' + c.id);'
                    - '}'
