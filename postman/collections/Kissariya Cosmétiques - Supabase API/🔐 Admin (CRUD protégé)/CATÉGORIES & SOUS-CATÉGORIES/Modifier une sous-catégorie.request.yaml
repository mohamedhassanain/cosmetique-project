$kind: http-request
description: Vous devez avoir mis subcategory_id dans l'environnement au préalable (modifiez la requête 'Sous-catégories d'une catégorie' pour capturer l'id).
url: "{{supabase_url}}/rest/v1/subcategories?id=eq.{{subcategory_id}}"
method: PATCH
headers:
  apikey: "{{anon_key}}"
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
  Prefer: return=representation
queryParams:
  id: eq.{{subcategory_id}}
body:
  type: json
  content: |-
    {
      "name": "Crèmes Solaires SPF 50",
      "slug": "cremes-solaires-spf-50"
    }
order: 4000
