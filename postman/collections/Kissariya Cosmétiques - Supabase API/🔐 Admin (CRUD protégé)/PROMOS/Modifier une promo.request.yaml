$kind: http-request
description: Équivalent de updatePromo().
url: "{{supabase_url}}/rest/v1/promos?id=eq.{{promo_id}}"
method: PATCH
headers:
  apikey: "{{anon_key}}"
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
  Prefer: return=representation
queryParams:
  id: eq.{{promo_id}}
body:
