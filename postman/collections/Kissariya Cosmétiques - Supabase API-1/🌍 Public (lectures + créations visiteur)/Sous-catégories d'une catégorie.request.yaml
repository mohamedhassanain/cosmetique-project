$kind: http-request
description: Équivalent de fetchSubcategories(category_id). Capture l'id dans subcategory_id.
url: "{{supabase_url}}/rest/v1/subcategories?select=*&category_id=eq.{{category_id}}&order=sort_order.asc"
method: GET
headers:
  apikey: "{{anon_key}}"
queryParams:
  select: "*"
  category_id: eq.{{category_id}}
  order: sort_order.asc
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.length > 0) pm.environment.set('subcategory_id', json[0].id);
    language: text/javascript
order: 6000
