$kind: http-request
description: "Équivalent de updateOrderStatus(). Statuts possibles: pending, confirmed, shipped, delivered, cancelled."
url: "{{supabase_url}}/rest/v1/orders?id=eq.{{order_id}}"
method: PATCH
headers:
  apikey: "{{anon_key}}"
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
  Prefer: return=representation
queryParams:
  id: eq.{{order_id}}
body:
  type: json
  content: |-
    {
      "status": "confirmed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      const o = Array.isArray(json) ? json[0] : json;
      pm.test('Statut = confirmed', () => pm.expect(o.status).to.eql('confirmed'));
    language: text/javascript
order: 2000
