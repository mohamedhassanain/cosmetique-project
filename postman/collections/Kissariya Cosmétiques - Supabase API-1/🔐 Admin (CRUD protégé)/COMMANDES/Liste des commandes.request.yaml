$kind: http-request
description: Équivalent de fetchOrders().
url: "{{supabase_url}}/rest/v1/orders?select=*&order=created_at.desc"
method: GET
headers:
  apikey: "{{anon_key}}"
  Authorization: Bearer {{access_token}}
queryParams:
  select: "*"
  order: created_at.desc
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.length > 0) pm.environment.set('order_id', json[0].id);
    language: text/javascript
order: 1000
