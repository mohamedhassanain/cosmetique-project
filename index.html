    <script>
      /**
       * Expert Fix: Trusted Types Global Policy & Sink Patching (v2)
       * Resolves "This document requires 'TrustedScript' assignment" errors
       * by intercepting string assignments to all sensitive sinks.
       */
      (function() {
        const tt = globalThis.trustedTypes;
        if (tt && tt.createPolicy) {
          const p = tt.defaultPolicy || (function() {
            try {
              return tt.createPolicy('default', {
                createHTML: s => s,
                createScript: s => s,
                createScriptURL: s => s,
              });
            } catch (e) {
              console.error('Trusted Types Policy creation failed:', e);
              return null;
            }
          })();

          if (p) {
            const patch = (obj, prop, type) => {
              const d = Object.getOwnPropertyDescriptor(obj, prop);
              if (d && d.set) {
                const s = d.set;
                Object.defineProperty(obj, prop, {
                  ...d,
                  set: function(v) {
                    if (typeof v === 'string') {
                      if (type === 'script' && (this.nodeName === 'SCRIPT' || this.tagName === 'SCRIPT')) {
                        s.call(this, p.createScript(v));
                      } else if (type === 'html') {
                        s.call(this, p.createHTML(v));
                      } else if (type === 'url') {
                        s.call(this, p.createScriptURL(v));
                      } else {
                        s.call(this, v);
                      }
                    } else {
                      s.call(this, v);
                    }
                  }
                });
              }
            };

            patch(Node.prototype, 'textContent', 'script');
            patch(HTMLElement.prototype, 'innerText', 'script');
            patch(Element.prototype, 'innerHTML', 'html');
            patch(Element.prototype, 'outerHTML', 'html');
            patch(HTMLScriptElement.prototype, 'src', 'url');
            patch(HTMLScriptElement.prototype, 'text', 'script');
          }
        }
      })();
    </script>
